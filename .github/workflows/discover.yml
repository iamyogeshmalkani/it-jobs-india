name: discover

# Manual helper: finds which hiring tool (Greenhouse, Lever, Ashby, Workable, Recruitee,
# SmartRecruiters) a company uses and prints the line to paste into data/companies.json.
# GitHub runners have open internet, so this works even where a local machine is blocked.
# Run it from the Actions tab: "Run workflow", then type company names separated by commas.

on:
  workflow_dispatch:
    inputs:
      names:
        description: 'Company names, comma separated (e.g. "Acme Labs, Globex")'
        required: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Find boards
        env:
          PYTHONPATH: src
          NAMES: ${{ inputs.names }}
        run: |
          IFS=',' read -ra LIST <<< "$NAMES"
          args=()
          for n in "${LIST[@]}"; do args+=("$(echo "$n" | xargs)"); done
          python -m jobbot discover "${args[@]}"
